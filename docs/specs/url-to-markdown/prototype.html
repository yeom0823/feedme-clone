<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: the project's own, or this minimal set as-is ── */
  /* copied verbatim from app/globals.css; Inter/Geist (next/font) replaced by system stack */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
    --font: Inter, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);

  /* ── product styles ── */
  .app { display: flex; flex-direction: column; min-height: calc(100dvh - 64px); max-width: 760px; margin: 0 auto; padding: 8px 0 0; color: var(--foreground) }
  .sh-vp-390 .app { min-height: 100% }
  .app-main { flex: 1; display: flex; flex-direction: column; gap: 20px }
  .app-header { display: flex; justify-content: flex-end; padding: 4px 0 }
  .hero h1 { font-size: 44px; line-height: 1.1; font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em }
  .hero p { margin: 0; color: var(--muted-foreground); font-size: 15px }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: calc(var(--radius) * .8); font: 500 14px var(--font); border: 1px solid transparent; cursor: pointer; white-space: nowrap; background: none; color: var(--foreground) }
  .btn svg { width: 16px; height: 16px; flex: none }
  .btn-default { background: var(--primary); color: var(--primary-foreground) }
  .btn-outline { border-color: var(--border); background: var(--background) }
  .btn-outline:hover, .btn-ghost:hover { background: var(--accent) }
  .btn-icon { width: 36px; padding: 0 }

  .chip { height: 28px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font: 13px var(--font); cursor: pointer }

  .tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: calc(var(--radius) * .8); background: var(--muted); align-self: flex-start }
  .tabs button { height: 28px; padding: 0 12px; border: 0; border-radius: calc(var(--radius) * .6); background: none; color: var(--muted-foreground); font: 500 13px var(--font); cursor: pointer }
  .tabs button[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / 10%) }
  .raw { margin: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); background: color-mix(in oklch, var(--muted) 40%, transparent); font: 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 560px; overflow: auto }
  .alert { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card) }

  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left }
  .app-footer { text-align: center; padding: 40px 0 16px; font-size: 12px; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 4px }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; max-width: min(420px, calc(100vw - 32px)); padding: 12px 16px; border-radius: var(--radius); background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: 0 8px 24px oklch(0 0 0 / 15%); font-size: 14px }
  .toast b { display: block; font-weight: 600 } .toast span { color: var(--muted-foreground) }
  .sh-vp-390 .toast { bottom: 40px }
  .sh-vp-390 .hero h1 { font-size: 36px }
  .sh-vp-390 .result-top { flex-direction: column }
  .sh-vp-390 .copy-col { align-self: stretch; align-items: stretch }
  .sh-vp-390 .split .btn:first-child { flex: 1 }
  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">
  <section data-screen="convert" data-title="변환" data-states="변환 중,결과,결과 (저자 없음·짧은 글),프롬프트 입력,잘못된 URL,가져오기 실패,본문 없음">
    <div class="app">
      <header class="app-header">
        <button class="btn btn-ghost btn-icon" id="theme-toggle" data-component="Button"></button>
      </header>
      <div class="app-main">
        <div class="hero">
          <h1>FEED-ME</h1>
          <p>어떤 URL이든, Markdown으로.</p>
        </div>
        <form id="url-form" novalidate data-component="Field">
          <div class="input-group" id="ig" data-component="InputGroup">
            <input id="url" type="url" inputmode="url" placeholder="https://example.com" autocomplete="off" aria-label="URL" data-component="InputGroupInput">
            <button type="button" class="btn btn-ghost btn-icon" id="clear" aria-label="입력 지우기" data-component="InputGroupButton" hidden></button>
            <button type="submit" class="btn btn-icon submit" id="submit" aria-label="가져오기" data-component="InputGroupButton"></button>
          </div>
          <p class="field-error" id="url-error" data-component="FieldError" hidden></p>
        </form>
        <div id="output"></div>
      </div>
      <footer class="app-footer">
        <div>© 2026 feed-me <span class="dot"></span> <a href="#" data-component="new:FooterLink">Feedback</a> <span class="dot"></span> <a href="#">GitHub</a></div>
      </footer>
    </div>
    <div class="toast" id="toast" data-component="Sonner" role="status" hidden></div>
  </section>
</main>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

    ext: svg('<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
    alert: svg('<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>')
  };
  const LIMIT = 6000; // assumed URL handoff threshold (chars, before encoding)
  const PRESETS = ['요약해줘', '한국어로 번역해줘', '쉽게 설명해줘'];

  const PAGES = {
    wiki: {
      url: 'https://en.wikipedia.org/wiki/Markdown', title: 'Markdown', author: 'Wikipedia', site: 'Wikipedia', chars: 33950,
      md: `**Markdown** is a [lightweight markup language](https://en.wikipedia.org/wiki/Lightweight_markup_language) for creating [formatted text](https://en.wikipedia.org/wiki/Formatted_text) using a [plain-text editor](https://en.wikipedia.org/wiki/Text_editor). John Gruber created Markdown in 2004 as an easy-to-read markup language. Markdown is widely used for blogging and instant messaging, and also used elsewhere in online forums, collaborative software, documentation pages, and readme files.

      md: `Next.js 16에서 가장 크게 바뀐 부분은 캐싱입니다. 이전에는 \`fetch\`가 기본으로 캐시되어 "왜 데이터가 안 바뀌지?"라는 질문이 끊이지 않았는데, 이제는 반대로 **명시적으로 캐시를 켜야** 합니다.

## 핵심 세 줄

- 기본은 동적 렌더링이다.
- 캐시하고 싶은 함수나 컴포넌트에 \`"use cache"\`를 붙인다.
- 무효화는 \`cacheTag\`와 \`updateTag\`로 한다.

async function getPosts() {
  "use cache";
  cacheTag("posts");
  return db.post.findMany();
}
\`\`\`

마이그레이션할 때는 \`next.config.ts\`에서 \`cacheComponents: true\`를 켜고, 빌드 경고를 하나씩 따라가면 됩니다.`,
      html: `<p>Next.js 16에서 가장 크게 바뀐 부분은 캐싱입니다. 이전에는 <code>fetch</code>가 기본으로 캐시되어 "왜 데이터가 안 바뀌지?"라는 질문이 끊이지 않았는데, 이제는 반대로 <strong>명시적으로 캐시를 켜야</strong> 합니다.</p>

<ul><li>기본은 동적 렌더링이다.</li><li>캐시하고 싶은 함수나 컴포넌트에 <code>"use cache"</code>를 붙인다.</li><li>무효화는 <code>cacheTag</code>와 <code>updateTag</code>로 한다.</li></ul>

  const $ = id => document.getElementById(id);
  const out = $('output'), urlIn = $('url'), ig = $('ig'), clearBtn = $('clear'), err = $('url-error'), submit = $('submit'), toastEl = $('toast');
  clearBtn.innerHTML = I.x;
  let state = 'empty', page = null, prompt = '', promptOpen = false, tab = 'preview', menuOpen = false, toastTimer, loadTimer;

  const isUrl = v => /^https?:\/\/[^\s.\/]+\.[^\s]+$/i.test(v.trim());
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function setPreset(name) { if (prototypeShell.getState() !== name) prototypeShell.setState(name) }
  function setQuery(v) { const q = v ? '?url=' + encodeURIComponent(v) : location.pathname; history.replaceState(null, '', (v ? q : location.pathname) + location.hash) }

  function render() {
    ig.setAttribute('aria-invalid', state === 'invalid');
    err.hidden = state !== 'invalid';
    err.textContent = 'http:// 또는 https://로 시작하는 웹 페이지 주소를 입력해 주세요.';
    submit.innerHTML = state === 'loading' ? I.spin : I.arrow;
    submit.disabled = state === 'loading' || !urlIn.value.trim();
    clearBtn.hidden = !urlIn.value;
    if (state === 'empty' || state === 'invalid') { out.innerHTML = ''; return; }
    if (state === 'loading') {
      out.innerHTML = `<div class="result" aria-busy="true"><div class="skeleton" style="height:26px;width:55%"></div><div class="skeleton" style="height:14px;width:30%"></div><div style="height:6px"></div>${[92,100,84,0,70,96,88].map(w => w ? `<div class="skeleton" data-component="Skeleton" style="height:14px;width:${w}%"></div>` : '<div style="height:6px"></div>').join('')}</div>`;
      return;
    }
    if (state === 'fetchfail' || state === 'nocontent') {
      const m = state === 'fetchfail'
        ? ['페이지를 가져오지 못했습니다', '주소가 맞는지, 로그인 없이 열리는 공개 페이지인지 확인한 뒤 다시 시도해 주세요.']
        : ['본문을 찾지 못했습니다', '이 페이지에서 읽을 수 있는 본문이 추출되지 않았습니다. 기사나 글 상세 페이지 주소로 다시 시도해 주세요.'];
      out.innerHTML = `<div class="result"><div class="alert" role="alert" data-component="Alert">${I.alert}<div><h4>${m[0]}</h4><p>${m[1]}</p></div><button class="btn btn-outline btn-sm" id="retry" data-component="Button">다시 시도</button></div></div>`;
      $('retry').onclick = () => convert(urlIn.value);
      return;
    }
    // result
    const names = page.author ? [page.author, page.site !== page.author ? page.site : ''] : [page.site];
    const byline = names.filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('<span class="dot"></span>');
    const hasPrompt = !!prompt.trim();
    out.innerHTML = `<article class="result">
      <div class="result-top">
        <header class="result-head"><h2>${esc(page.title)}</h2>
          <div class="byline">${byline}<span class="dot"></span><a href="${esc(page.url)}" target="_blank" rel="noopener">${esc(page.url.replace(/^https?:\/\//, ''))}</a></div></header>
        <div class="copy-col">
          <div class="split" data-component="ButtonGroup">
            <button class="btn btn-outline btn-sm" id="copy" data-component="Button">${I.copy}복사하기</button>
            <button class="btn btn-outline btn-sm" id="more" aria-label="열기 옵션" aria-haspopup="menu" aria-expanded="${menuOpen}" data-component="DropdownMenuTrigger">${I.chev}</button>
          </div>
          ${hasPrompt ? '<span class="copy-note">프롬프트 포함</span>' : ''}
          ${menuOpen ? `<div class="menu" role="menu" data-component="DropdownMenuContent">
            <button role="menuitem" id="m-dl">${I.dl}마크다운 다운로드</button>
            <button role="menuitem" id="m-gpt">${I.ext}ChatGPT에서 열기</button>
            <button role="menuitem" id="m-claude">${I.ext}Claude에서 열기</button></div>` : ''}
        </div>
      </div>
      <button class="btn btn-ghost btn-xs prompt-toggle" id="ptoggle" aria-expanded="${promptOpen}" data-component="CollapsibleTrigger">${I.plus}프롬프트 추가하기${promptOpen ? I.chev : I.chevR}</button>
      ${promptOpen ? `<div class="prompt-box" data-component="CollapsibleContent">
        <div class="textarea-wrap"><textarea class="textarea" id="ptext" data-component="Textarea" placeholder="ex) 이 글을 요약해줘" aria-label="프롬프트">${esc(prompt)}</textarea>
          ${hasPrompt ? `<button class="btn btn-ghost btn-icon" id="pclear" aria-label="프롬프트 지우기" data-component="Button">${I.x}</button>` : ''}</div>
        <div class="chips">${PRESETS.map(p => `<button class="chip" data-component="Toggle" data-p="${p}" aria-pressed="${prompt.trim() === p}">${p}</button>`).join('')}</div>
      </div>` : ''}
      <div class="tabs" role="tablist" data-component="Tabs">
        <button role="tab" data-t="preview" aria-selected="${tab === 'preview'}">미리보기</button>
        <button role="tab" data-t="raw" aria-selected="${tab === 'raw'}">Markdown</button>
      </div>
      ${tab === 'preview' ? `<div class="md" data-component="new:MarkdownView">${page.html}</div>` : `<pre class="raw" data-component="new:MarkdownSource">${esc(page.md)}</pre>`}
    </article>`;

    $('copy').onclick = () => { menuOpen = false; render(); const b = $('copy'); b.innerHTML = I.check + '복사됨'; setTimeout(() => { if ($('copy')) $('copy').innerHTML = I.copy + '복사하기' }, 1500);
      toast('복사했습니다', hasPrompt ? '프롬프트와 Markdown 본문이 클립보드에 있습니다.' : 'Markdown 본문이 클립보드에 있습니다.'); };
    $('more').onclick = e => { e.stopPropagation(); menuOpen = !menuOpen; render(); if (menuOpen) $('m-dl').focus(); };
    if (menuOpen) {
      $('m-dl').onclick = () => { menuOpen = false; render(); toast('다운로드했습니다', slug(page.title) + '.md'); };
      $('m-gpt').onclick = () => { menuOpen = false; render(); openLLM('ChatGPT'); };
      $('m-claude').onclick = () => { menuOpen = false; render(); openLLM('Claude'); };
    }
    $('ptoggle').onclick = () => { promptOpen = !promptOpen; render(); if (promptOpen) $('ptext').focus(); };
    if (promptOpen) {
      const ta = $('ptext');
      ta.oninput = () => { const had = !!prompt.trim(); prompt = ta.value; if (had !== !!prompt.trim()) { const pos = ta.selectionStart; render(); const t = $('ptext'); t.focus(); t.setSelectionRange(pos, pos); } else syncChips(); };
      if ($('pclear')) $('pclear').onclick = () => { prompt = ''; render(); $('ptext').focus(); };
      out.querySelectorAll('.chip').forEach(c => c.onclick = () => { prompt = c.dataset.p; render(); });
    }
    out.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  }
  function syncChips() { out.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', prompt.trim() === c.dataset.p)) }
  document.addEventListener('click', e => { if (menuOpen && !e.target.closest('.menu')) { menuOpen = false; render(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuOpen) { menuOpen = false; render(); $('more').focus(); } });

  function slug(t) { return t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') }
  function openLLM(name) {
    const p = prompt.trim();
    const len = page.chars + (p ? p.length + 2 : 0);
    if (len <= LIMIT) toast(`${name}를 새 탭에서 열었습니다`, p ? '프롬프트와 본문이 입력창에 들어가 있습니다.' : '본문이 입력창에 들어가 있습니다.');
    else toast('본문이 길어 클립보드에 복사했습니다', `${name} 새 대화에 붙여넣기(Ctrl+V) 하세요.${p ? ' 프롬프트도 함께 복사됐습니다.' : ''}`);
  }
  function toast(title, desc) {
    toastEl.innerHTML = `<b>${title}</b><span>${desc}</span>`;
    toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.hidden = true, 3200);
  }

  function convert(raw) {
    const v = raw.trim();
    clearTimeout(loadTimer); menuOpen = false;
    if (!isUrl(v)) { state = 'invalid'; setPreset('잘못된 URL'); return render(); }
    urlIn.value = v; setQuery(v);
    state = 'loading'; setPreset('변환 중'); render();
    loadTimer = setTimeout(() => {
      tab = 'preview';
      if (/fail|404|members-only/i.test(v)) { state = 'fetchfail'; setPreset('가져오기 실패'); }
      else if (/instagram\.com|empty/i.test(v)) { state = 'nocontent'; setPreset('본문 없음'); }
      else { page = /velog|short/i.test(v) ? PAGES.short : PAGES.wiki; if (!/wiki|velog/.test(v)) page = { ...page, url: v };
             state = 'result'; setPreset(page.chars > LIMIT ? '결과' : '결과 (저자 없음·짧은 글)'); }
      render();
    }, 1100);
  }

  $('url-form').onsubmit = e => { e.preventDefault(); convert(urlIn.value); };
  urlIn.addEventListener('paste', e => {
    const text = (e.clipboardData || window.clipboardData).getData('text');
    const next = (urlIn.value.slice(0, urlIn.selectionStart) + text + urlIn.value.slice(urlIn.selectionEnd)).trim();
    if (isUrl(next)) { e.preventDefault(); urlIn.value = next; convert(next); }
  });
  urlIn.oninput = () => { if (state === 'invalid') { state = 'empty'; setPreset('Default'); } render(); };
  clearBtn.onclick = () => { clearTimeout(loadTimer); urlIn.value = ''; page = null; prompt = ''; promptOpen = false; tab = 'preview'; menuOpen = false; state = 'empty'; setQuery(''); setPreset('Default'); render(); urlIn.focus(); };

  // product dark-mode toggle drives the same theme class as the review bar; product default is dark
  const tbtn = $('theme-toggle');
  function syncThemeBtn() { const d = document.body.classList.contains('sh-theme-dark'); tbtn.innerHTML = d ? I.moon : I.sun; tbtn.setAttribute('aria-label', d ? '라이트 모드로 전환' : '다크 모드로 전환'); }
  tbtn.onclick = () => document.querySelector(`#sh-theme button[data-theme="${document.body.classList.contains('sh-theme-dark') ? 'light' : 'dark'}"]`).click();
  new MutationObserver(syncThemeBtn).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  document.querySelector('#sh-theme button[data-theme="dark"]').click(); syncThemeBtn();

  // review-bar state presets
  $('sh-state').addEventListener('change', e => {
    clearTimeout(loadTimer); menuOpen = false; tab = 'preview'; prompt = ''; promptOpen = false;
    const s = e.target.value;
    if (s === 'Default') { urlIn.value = ''; state = 'empty'; }
    if (s === '변환 중') { urlIn.value = PAGES.wiki.url; state = 'loading'; }
    if (s === '결과') { urlIn.value = PAGES.wiki.url; page = PAGES.wiki; state = 'result'; }
    if (s === '결과 (저자 없음·짧은 글)') { urlIn.value = PAGES.short.url; page = PAGES.short; state = 'result'; }
    if (s === '프롬프트 입력') { urlIn.value = PAGES.wiki.url; page = PAGES.wiki; state = 'result'; promptOpen = true; prompt = '한국어로 번역해줘'; }
    if (s === '잘못된 URL') { urlIn.value = 'velog.io 글 링크'; state = 'invalid'; }
    if (s === '가져오기 실패') { urlIn.value = 'https://medium.com/@someone/members-only-404'; state = 'fetchfail'; }
    if (s === '본문 없음') { urlIn.value = 'https://www.instagram.com/p/C9xk2LmP0aQ/'; state = 'nocontent'; }
    setQuery(['result', 'loading', 'fetchfail', 'nocontent'].includes(state) ? urlIn.value : '');
    render();
  });

  // open with ?url= → convert immediately
  const initial = new URLSearchParams(location.search).get('url');
  render();
  if (initial) { urlIn.value = initial; convert(initial); }
</script>
